# Fly.io configuration for Treeline Hub
#
# Deploy: fly deploy --dockerfile Dockerfile.hub
# Logs:   fly logs
# SSH:    fly ssh console

app = "treeline-hub"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.hub"

[env]
  TREELINE_DIR = "/data"

[http_service]
  internal_port = 4242
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "treeline_data"
  destination = "/data"
