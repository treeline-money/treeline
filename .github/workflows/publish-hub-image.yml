name: Publish Hub Image

# Builds Dockerfile.hub and pushes to GHCR. Treeline Cloud's per-user
# Fly apps pull ghcr.io/treeline-money/treeline-hub:latest, so :latest
# must track main. Versioned tags are pushed when a release is cut.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'cli/**'
      - 'template/**'
      - 'Dockerfile.hub'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/publish-hub-image.yml'
  release:
    types: [published]
  # Called by release.yml so each release publishes its versioned image in
  # the same run. workflow_call executes inline, so it isn't subject to the
  # "events from GITHUB_TOKEN don't trigger workflows" rule that keeps the
  # release: trigger above from ever firing (releases are cut with
  # GITHUB_TOKEN).
  workflow_call:
    inputs:
      version:
        description: 'Version tag for the image (CalVer, e.g. 26.5.2402)'
        required: true
        type: string
      ref:
        description: 'Git ref/tag to build from (defaults to the triggering ref)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 26.5.2402). Empty = only :latest + :sha-<sha>.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref/tag to build from (defaults to the triggering ref)'
        required: false
        type: string
        default: ''

# One run per ref — stale builds get cancelled when a newer commit lands.
# Versioned publishes get their own group so a routine main push can't
# cancel a release's image build (and vice versa).
concurrency:
  group: publish-hub-image-${{ github.ref }}-${{ inputs.version || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: treeline-money/treeline-hub

jobs:
  publish:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on push/dispatch-without-ref → checkout's default (the
          # triggering ref). release.yml passes the version tag so the image
          # is built from exactly the released commit.
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          # A version passed in (release flow via workflow_call, or a manual
          # dispatch) wins; otherwise fall back to the release tag name.
          VERSION="${VERSION_INPUT:-}"
          if [ -z "$VERSION" ] && [ "$EVENT_NAME" = "release" ]; then
            VERSION="$RELEASE_TAG"
          fi

          TAGS=()
          if [ -n "$VERSION" ]; then
            # Strip a leading v (v26.5.2402 → 26.5.2402). Tag the version and
            # bump :latest so existing pulls reflect the new release.
            TAGS+=("${IMAGE}:${VERSION#v}")
            TAGS+=("${IMAGE}:latest")
          else
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:sha-${SHORT_SHA}")
          fi

          # Join with newlines for build-push-action's `tags:` input.
          {
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          printf 'Image tags:\n%s' "$(printf '  %s\n' "${TAGS[@]}")"

      # Mirror ci.yml's `build-cli` job: bump the workspace version in
      # Cargo.toml before the Rust build so `tl --version` in the image
      # reflects the release tag, not the stale Cargo.toml at the SHA.
      # Build-time mutation only — not committed. Only applies on release;
      # push/workflow_dispatch builds keep using HEAD's Cargo.toml.
      - name: Update version in Cargo.toml (versioned builds)
        if: inputs.version != '' || github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # Strip a leading `v` if present so e.g. `v26.4.2901` → `26.4.2901`.
          RAW="${VERSION_INPUT:-$RELEASE_TAG}"
          VERSION="${RAW#v}"
          echo "Setting workspace version to $VERSION"
          sed -i 's/^version = .*/version = "'"$VERSION"'"/' Cargo.toml

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # GHA cache for Docker layers — Rust compiles dominate the build,
          # so layer reuse on subsequent runs is the big win. `mode=max`
          # caches intermediate stages too (the builder stage).
          cache-from: type=gha,scope=hub-image
          cache-to: type=gha,mode=max,scope=hub-image
          provenance: false
