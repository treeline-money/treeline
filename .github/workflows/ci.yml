name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress builds when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Silence auto-update chatter from both the desktop app and the tl CLI
# across every job/step — keeps CI noise out of release/API metrics.
env:
  TREELINE_DISABLE_UPDATE_CHECKS: "1"

jobs:
  # Generate CalVer version for this build
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_main: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Generate CalVer
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CalVer format: YY.M.DDRR where DDRR = day*100 + release_number
          YEAR=$(date -u +%y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          DAY_BASE=$((DAY * 100))

          # Find highest release number for today by checking existing tags
          LATEST_TODAY=$(gh api repos/${{ github.repository }}/tags --paginate --jq '.[].name' 2>/dev/null | \
            grep "^${YEAR}\.${MONTH}\." | \
            while read tag; do
              DDRR=$(echo "$tag" | sed "s/^${YEAR}\.${MONTH}\.//")
              if [ "$DDRR" -ge "$DAY_BASE" ] && [ "$DDRR" -lt "$((DAY_BASE + 100))" ]; then
                echo "$DDRR"
              fi
            done | sort -rn | head -1)

          if [ -n "$LATEST_TODAY" ]; then
            # Increment from highest today
            RUN=$((LATEST_TODAY - DAY_BASE + 1))
          else
            # First release of the day
            RUN=1
          fi

          DDRR=$((DAY * 100 + RUN))
          VERSION="${YEAR}.${MONTH}.${DDRR}"

          echo "Generated version: $VERSION (release $RUN for today)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Core + CLI tests
  test-core-cli:
    name: Test Core + CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Get cache key
        id: cache-key
        run: echo "week=$(date -u +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-core-${{ steps.cache-key.outputs.week }}"

      - name: Encryption diagnostic
        run: cargo test --test aaa_encryption_diagnostic -- --nocapture

      - name: Run tests
        run: cargo test

  # Desktop tests + e2e WebDriver suite (single job to avoid duplicate Tauri compile)
  test-desktop:
    name: Test Desktop + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - uses: actions/checkout@v4

      # Plugin sibling checkouts for the e2e seed (TAURI_E2E_PLUGINS_DIR points
      # conftest.py at $GITHUB_WORKSPACE so it finds plugin-* alongside treeline)
      - name: Checkout plugin-budget
        uses: actions/checkout@v4
        with:
          repository: treeline-money/plugin-budget
          path: plugin-budget
      - name: Checkout plugin-goals
        uses: actions/checkout@v4
        with:
          repository: treeline-money/plugin-goals
          path: plugin-goals
      - name: Checkout plugin-subscriptions
        uses: actions/checkout@v4
        with:
          repository: treeline-money/plugin-subscriptions
          path: plugin-subscriptions
      - name: Checkout plugin-cashflow
        uses: actions/checkout@v4
        with:
          repository: treeline-money/plugin-cashflow
          path: plugin-cashflow
      - name: Checkout plugin-emergency-fund
        uses: actions/checkout@v4
        with:
          repository: treeline-money/plugin-emergency-fund
          path: plugin-emergency-fund

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            sdk/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get cache key
        id: cache-key
        run: echo "week=$(date -u +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          prefix-key: "ci-desktop-${{ steps.cache-key.outputs.week }}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev xvfb

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build SDK (local dependency)
        working-directory: sdk
        run: npm ci && npm run build

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Type check (frontend)
        working-directory: desktop
        run: npm run check

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Run tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build CLI (used by e2e seed)
        run: cargo build --bin tl

      - name: Build Tauri app for e2e (debug + e2e-testing feature, no bundle)
        working-directory: desktop
        run: npx tauri build --debug --no-bundle --features e2e-testing

      - name: Install e2e Python deps
        working-directory: desktop/e2e
        run: uv sync

      - name: Run e2e tests
        working-directory: desktop/e2e
        env:
          TAURI_E2E_BINARY: ${{ github.workspace }}/desktop/src-tauri/target/debug/treeline
          TAURI_E2E_PLUGINS_DIR: ${{ github.workspace }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" uv run pytest -v

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-linux
          path: desktop/e2e/screenshots/
          if-no-files-found: ignore

  # Build desktop app (only on main pushes, not PRs)
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test-core-cli, test-desktop]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-triple: x86_64-unknown-linux-gnu
            artifact-name: desktop-linux-x64
          - os: macos-latest
            target-triple: aarch64-apple-darwin
            artifact-name: desktop-macos-arm64
          - os: macos-15-intel
            target-triple: x86_64-apple-darwin
            artifact-name: desktop-macos-x64
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            artifact-name: desktop-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            sdk/package-lock.json
            desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
          shared-key: "build-desktop"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Build SDK (local dependency)
        working-directory: sdk
        run: npm ci && npm run build

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      - name: Update version files
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Setting version to $VERSION"

          # Update desktop/package.json
          if command -v jq &> /dev/null; then
            jq ".version = \"$VERSION\"" desktop/package.json > tmp.json && mv tmp.json desktop/package.json
          else
            # Windows fallback using node
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('desktop/package.json')); p.version='$VERSION'; fs.writeFileSync('desktop/package.json', JSON.stringify(p,null,2));"
          fi

          # Update desktop/src-tauri/tauri.conf.json
          if command -v jq &> /dev/null; then
            jq ".version = \"$VERSION\"" desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json desktop/src-tauri/tauri.conf.json
          else
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('desktop/src-tauri/tauri.conf.json')); p.version='$VERSION'; fs.writeFileSync('desktop/src-tauri/tauri.conf.json', JSON.stringify(p,null,2));"
          fi

          # Update desktop/src-tauri/Cargo.toml
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sed -i 's/^version = .*/version = "'"$VERSION"'"/' desktop/src-tauri/Cargo.toml
          else
            sed -i '' 's/^version = .*/version = "'"$VERSION"'"/' desktop/src-tauri/Cargo.toml 2>/dev/null || \
            sed -i 's/^version = .*/version = "'"$VERSION"'"/' desktop/src-tauri/Cargo.toml
          fi

          echo "Version files updated"

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Clean up certificate file
          rm $RUNNER_TEMP/certificate.p12

      - name: Write Apple API key (macOS)
        if: runner.os == 'macOS'
        run: echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > $RUNNER_TEMP/AuthKey.p8

      - name: Build Tauri app (non-macOS)
        if: runner.os != 'macOS'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build && npx tauri build

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: npm run build && npx tauri build

      - name: Notarize app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 40
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/Treeline.app"
          DMG_PATH="desktop/src-tauri/target/release/bundle/dmg"

          echo "Creating zip for notarization..."
          cd desktop/src-tauri/target/release/bundle/macos
          zip -r Treeline.zip Treeline.app
          cd -

          echo "Submitting for notarization..."
          xcrun notarytool submit \
            desktop/src-tauri/target/release/bundle/macos/Treeline.zip \
            --key ${{ runner.temp }}/AuthKey.p8 \
            --key-id ${{ secrets.APPLE_API_KEY }} \
            --issuer ${{ secrets.APPLE_API_ISSUER }} \
            --wait \
            --timeout 15m

          echo "Stapling notarization ticket to app..."
          xcrun stapler staple "$APP_PATH"

          # Re-create DMG with notarized app
          echo "Re-creating DMG with notarized app..."
          DMG_NAME=$(ls "$DMG_PATH"/*.dmg | head -1 | xargs basename)
          rm -f "$DMG_PATH/$DMG_NAME"
          hdiutil create -volname "Treeline" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH/$DMG_NAME"

          # Sign the DMG
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH/$DMG_NAME"

          # Notarize and staple the DMG
          xcrun notarytool submit "$DMG_PATH/$DMG_NAME" \
            --key ${{ runner.temp }}/AuthKey.p8 \
            --key-id ${{ secrets.APPLE_API_KEY }} \
            --issuer ${{ secrets.APPLE_API_ISSUER }} \
            --wait \
            --timeout 15m

          xcrun stapler staple "$DMG_PATH/$DMG_NAME"

          echo "Notarization complete!"

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg.sig
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7

      - name: Smoke test AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install xvfb for headless display
          sudo apt-get install -y xvfb

          # Find the AppImage
          APPIMAGE=$(find desktop/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          echo "Testing AppImage: $APPIMAGE"

          # Make executable
          chmod +x "$APPIMAGE"

          # Run with virtual framebuffer, capture any errors
          echo "Starting AppImage with xvfb..."
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" "$APPIMAGE" &
          APP_PID=$!

          # Wait for app to initialize
          sleep 10

          # Check if process is still running (didn't crash)
          if kill -0 $APP_PID 2>/dev/null; then
            echo "AppImage started successfully and is running"
            # Gracefully terminate
            kill $APP_PID 2>/dev/null || true
            sleep 2
            kill -9 $APP_PID 2>/dev/null || true
          else
            echo "AppImage crashed or failed to start"
            exit 1
          fi

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 7

  # Build CLI binaries (only on main pushes)
  build-cli:
    name: Build CLI (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test-core-cli, test-desktop]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: cli-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: cli-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact-name: cli-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: cli-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cli"

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Setting CLI version to $VERSION"

          # Update workspace version in root Cargo.toml
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sed -i 's/^version = .*/version = "'"$VERSION"'"/' Cargo.toml
          else
            sed -i '' 's/^version = .*/version = "'"$VERSION"'"/' Cargo.toml 2>/dev/null || \
            sed -i 's/^version = .*/version = "'"$VERSION"'"/' Cargo.toml
          fi

      - name: Build CLI
        run: cargo build --release --bin tl

      - name: Verify CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          echo "=== Verifying tl --version ==="
          ./target/release/tl --version

          echo "=== Verifying tl --help ==="
          ./target/release/tl --help

          echo "=== Verifying tl status ==="
          # status may return non-zero if no data exists, but shouldn't crash
          ./target/release/tl status || true

          echo "=== CLI verification passed ==="

      - name: Smoke test encrypt/decrypt (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          export TREELINE_DIR=$(mktemp -d)
          echo "Using TREELINE_DIR=$TREELINE_DIR"

          echo "=== Creating database with schema ==="
          ./target/release/tl status --json || true

          echo "=== Encrypting database ==="
          export TREELINE_PASSWORD=smoke-test-pwd-123
          ./target/release/tl encrypt --json

          echo "=== Verifying encryption status ==="
          STATUS=$(./target/release/tl encrypt --json status)
          echo "$STATUS"
          echo "$STATUS" | grep -q '"encrypted": true'

          echo "=== Verifying data accessible with password ==="
          TL_DB_PASSWORD=smoke-test-pwd-123 ./target/release/tl status --json

          echo "=== Testing lock/unlock (keychain-dependent) ==="
          unset TREELINE_PASSWORD
          # Check if keychain is available on this platform
          KEYCHAIN=$(./target/release/tl encrypt --json status | grep -o '"keychain_available": [a-z]*' | grep -o '[a-z]*$')
          if [ "$KEYCHAIN" = "true" ]; then
            echo "Keychain available — testing lock/unlock"
            ./target/release/tl encrypt lock
            if ./target/release/tl status --json 2>/dev/null; then
              echo "ERROR: Should have failed without password"
              exit 1
            fi
            echo "Correctly failed without password"
            ./target/release/tl encrypt unlock --password smoke-test-pwd-123
            ./target/release/tl status --json
          else
            echo "Keychain not available — testing env var path"
            if ./target/release/tl status --json 2>/dev/null; then
              echo "ERROR: Should have failed without password"
              exit 1
            fi
            echo "Correctly failed without password"
            TL_DB_PASSWORD=smoke-test-pwd-123 ./target/release/tl status --json
          fi

          echo "=== Decrypting database ==="
          export TREELINE_PASSWORD=smoke-test-pwd-123
          ./target/release/tl decrypt --json

          echo "=== Verifying data accessible without password ==="
          unset TREELINE_PASSWORD
          ./target/release/tl status --json

          echo "=== Encrypt/decrypt smoke test passed ==="
          rm -rf "$TREELINE_DIR"

      - name: Verify CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Output "=== Verifying tl --version ==="
          .\target\release\tl.exe --version

          Write-Output "=== Verifying tl --help ==="
          .\target\release\tl.exe --help

          Write-Output "=== Verifying tl status ==="
          # status may return non-zero if no data exists, but shouldn't crash
          try { .\target\release\tl.exe status } catch { }

          Write-Output "=== CLI verification passed ==="

      - name: Smoke test encrypt/decrypt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:TREELINE_DIR = Join-Path $env:RUNNER_TEMP "tl-smoke-test"
          New-Item -ItemType Directory -Path $env:TREELINE_DIR -Force | Out-Null
          Write-Output "Using TREELINE_DIR=$env:TREELINE_DIR"

          Write-Output "=== Creating database with schema ==="
          try { .\target\release\tl.exe status --json } catch { }

          Write-Output "=== Encrypting database ==="
          $env:TREELINE_PASSWORD = "smoke-test-pwd-123"
          .\target\release\tl.exe encrypt --json

          Write-Output "=== Verifying encryption status ==="
          $status = .\target\release\tl.exe encrypt --json status | Out-String
          Write-Output $status
          if ($status -notmatch '"encrypted": true') { throw "Expected encrypted: true" }

          Write-Output "=== Verifying data accessible with password ==="
          $env:TL_DB_PASSWORD = "smoke-test-pwd-123"
          .\target\release\tl.exe status --json

          Write-Output "=== Locking keychain and verifying data inaccessible ==="
          Remove-Item Env:\TREELINE_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:\TL_DB_PASSWORD -ErrorAction SilentlyContinue
          .\target\release\tl.exe encrypt lock
          $failed = $false
          try { .\target\release\tl.exe status --json 2>$null } catch { $failed = $true }
          if (-not $failed) {
            # Check exit code manually
            if ($LASTEXITCODE -eq 0) { throw "Should have failed without password" }
          }
          Write-Output "Correctly failed without password"

          Write-Output "=== Unlocking via CLI and verifying data accessible ==="
          .\target\release\tl.exe encrypt unlock --password smoke-test-pwd-123
          .\target\release\tl.exe status --json

          Write-Output "=== Decrypting database ==="
          $env:TREELINE_PASSWORD = "smoke-test-pwd-123"
          .\target\release\tl.exe decrypt --json

          Write-Output "=== Verifying data accessible without password ==="
          Remove-Item Env:\TREELINE_PASSWORD -ErrorAction SilentlyContinue
          .\target\release\tl.exe status --json

          Write-Output "=== Encrypt/decrypt smoke test passed ==="
          Remove-Item -Recurse -Force $env:TREELINE_DIR

      - name: Upload CLI artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: target/release/tl
          retention-days: 7

      - name: Upload CLI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: target/release/tl.exe
          retention-days: 7

  # Pack SDK (don't publish yet - that happens at release time)
  pack-sdk:
    name: Pack SDK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test-core-cli, test-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Update SDK version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Setting SDK version to $VERSION"
          jq ".version = \"$VERSION\"" sdk/package.json > tmp.json && mv tmp.json sdk/package.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Pack SDK (create tarball)
        working-directory: sdk
        run: npm pack

      - name: Upload SDK tarball
        uses: actions/upload-artifact@v4
        with:
          name: sdk-npm-package
          path: sdk/*.tgz
          retention-days: 7

  # Save version info for release workflow
  save-version:
    name: Save Version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build-desktop, build-cli, pack-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Save version to artifact
        run: |
          echo "${{ needs.version.outputs.version }}" > version.txt
          echo "Version: $(cat version.txt)"

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt
          retention-days: 7
